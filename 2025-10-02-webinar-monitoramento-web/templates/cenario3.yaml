zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 5e95220086f04ddea39633b071d4cf11
      name: WEBINAR
  templates:
    - uuid: e805a726ca3d48f8b918ebc87e3da05b
      template: 'Website JLCP by Browser'
      name: 'Website JLCP by Browser'
      description: |
        The template to monitor a website's availability and performance on the website by Browser.
        
        Zabbix server uses a web browser to perform navigation and collect performance metrics.
        
        Generated by official Zabbix template tool "Templator"
      groups:
        - name: WEBINAR
      items:
        - uuid: b86bd945ac1d4a999926c76a8e4e002b
          name: 'LLD {$WEBSITE.DOMAIN} Get data'
          type: BROWSER
          key: lld.website.get.data
          delay: '{$WEBSITE.GET.DATA.INTERVAL}'
          history: '0'
          value_type: TEXT
          trends: '0'
          params: |
            var browser, result;
            browser = new Browser(Browser.chromeOptions());
            try {
                var params = JSON.parse(value);  // Parse the JSON string containing parameters passed from Zabbix.
                function uniq(a) {
                    return a.sort().filter(function (item, pos, ary) {
                        return !pos || item != ary[pos - 1];
                    });
                }
                browser.navigate(params.scheme + '://' + params.domain + params.path);
                var el = browser.findElements("link text", "");
                var links = [];
                for (var n = 0; n < el.length; n++) {
                    links.push(el[n].getAttribute('href'));
                }
                links = uniq(links);
                result = [];
                for (i = 0; i < links.length; i++) {
                    if (links[i].match(/^http.*blog.*/)) {
                        var row = {};
                        row["{#URL}"] = links[i];
                        result.push(row);
                    }
                }
            }
            catch (err) {
                if (!(err instanceof BrowserError)) {
                    browser.setError(err.message);
                }
                result = browser.getResult();
                result.error.screenshot = browser.getScreenshot();
            }
            finally {
                return JSON.stringify(result);
            }
          description: 'Returns the JSON with performance counters of the requested website.'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
          parameters:
            - name: domain
              value: '{$WEBSITE.DOMAIN}'
            - name: path
              value: '{$WEBSITE.PATH}'
            - name: scheme
              value: '{$WEBSITE.SCHEME}'
          tags:
            - tag: component
              value: raw
        - uuid: 5b520f3c6f1743849c4de585206fa973
          name: 'Website {$WEBSITE.DOMAIN} Get data'
          type: BROWSER
          key: website.get.data
          delay: '{$WEBSITE.GET.DATA.INTERVAL}'
          history: '0'
          value_type: TEXT
          trends: '0'
          params: |
            const Website = {
                params: {},
            
                setParams(params) {
                    ['scheme', 'domain','width', 'height'].forEach(function (field) {
                        if (typeof params !== 'object' || !params[field]) {
                            throw new Error('Required param is not set: ' + field + '.');
                        }
                    });
                    this.params = params;
                },
            
                getOptions(browser) {
                    switch ((browser || '').trim().toLowerCase()) {
                        case 'firefox':
                            return Browser.firefoxOptions();
                        case 'safari':
                            return Browser.safariOptions();
                        case 'edge':
                            return Browser.edgeOptions();
                        default:
                            return Browser.chromeOptions();
                    }
                },
            
                getPerformance() {
                    const browser = new Browser(Website.getOptions(Website.params.browser));
                    const url = Website.params.scheme + '://' + Website.params.domain + '/' + Website.params.path
                    const screenshot = '';
                    browser.setScreenSize(Number(Website.params.width), Number(Website.params.height))
                    browser.navigate(url);
                    browser.collectPerfEntries();
                    screenshot = browser.getScreenshot();
                    const result = browser.getResult();
                    result.screenshot = screenshot;
            
                    return JSON.stringify(result);
                }
            };
            
            try {
                Website.setParams(JSON.parse(value));
                return Website.getPerformance();
            
            } catch (error) {
                error += (String(error).endsWith('.')) ? '' : '.';
                Zabbix.log(3, '[ Website get metrics] ERROR: ' + error);
                return JSON.stringify({ 'error': error });
            }
          description: 'Returns the JSON with performance counters of the requested website.'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
          parameters:
            - name: browser
              value: '{$WEBSITE.BROWSER}'
            - name: domain
              value: '{$WEBSITE.DOMAIN}'
            - name: height
              value: '{$WEBSITE.SCREEN.HEIGHT}'
            - name: path
              value: '{$WEBSITE.PATH}'
            - name: scheme
              value: '{$WEBSITE.SCHEME}'
            - name: width
              value: '{$WEBSITE.SCREEN.WIDTH}'
          tags:
            - tag: component
              value: raw
        - uuid: 077d9caf451741eab331a66d692056cb
          name: 'Get metrics check'
          type: DEPENDENT
          key: website.metrics.check
          delay: '0'
          history: 7d
          value_type: CHAR
          trends: '0'
          description: 'Check that the performance counters of the requested website data has been received correctly.'
          preprocessing:
            - type: JSONPATH
